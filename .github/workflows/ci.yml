name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit, integration, end-to-end (headless Chrome) and performance tests
        run: pytest -q
      - name: Live sanity checks against Gemini and Ethereum (informational)
        run: LIVE=1 pytest -q tests/test_live.py
        continue-on-error: true
